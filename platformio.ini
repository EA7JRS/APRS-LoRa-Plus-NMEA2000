;
; Placa: Seeed Studio XIAO ESP32-S3 + XIAO CAN Bus Expansion Board (MCP2515 + SN65HVD230) + HAT XIAO-LOG (opcional).
; Pines por defecto en src/config.h; se cambian luego en la WebUI.

[platformio]
default_envs = xiao_esp32s3_can

[env:xiao_esp32s3_can]
platform = espressif32 @ 8.0.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
	-std=gnu++17
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINOJSON_ENABLE_STD_STRING=1
	-D GW_BOARD='"${PIOENV}"'
	-D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED=1
	-D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED=1
; Avisos como errores solo en el código propio
build_src_flags =
	-Wall
	-Werror
	-Wno-error=cpp
	-Wno-error=deprecated-declarations
lib_deps =
	bblanchon/ArduinoJson @ 7.4.3
	h2zero/NimBLE-Arduino @ 2.5.2
	https://github.com/ttlappalainen/NMEA2000.git#8d101b33e8695f6ac040d1fdd4f4463b0340eb64
	https://github.com/ttlappalainen/NMEA2000_mcp.git#53cf6eae69cb71f9ac87f037ab1dfd3722e98776
	https://github.com/ttlappalainen/CAN_BUS_Shield.git#0cd860338efb30c3fe963268530bdc726b6783e4
